    <p>陣営:クルーメイト</p>
    <p>シェリフは、インポスターをキル可能な強力なクルーメイト役職です。</p>
    <p> </p>
    <h3>・アクティブ能力:キル</h3>
    <p>インポスターをキルできます。しかしながらクルー陣営の誰かをキルしようとすると、自身が死亡してしまいます。</p>
    <p> </p>
    <h3>・設定</h3>
    <h3>キル回数:その名前の通りキル可能な回数を設定します。</h3>
    <p>初期値:1 最小値:1 最大値:5 間隔:1</p>
    <h3>第三陣営をキル:第三陣営もキル可能か設定します。</h3>
    <p>設定内容:可能/不可 初期値:可能</p>
